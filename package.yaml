name: hledger-flow
version: 0.20.0
synopsis: An hledger workflow focusing on automated statement import and classification.
category: Finance, Console
license: GPL-3
author: "Andreas Pauley <hledger-flow@pauley.org.za>"
maintainer: "Andreas Pauley <hledger-flow@pauley.org.za>"
copyright: "2023 Andreas Pauley"
github: "apauley/hledger-flow"
bug-reports: https://github.com/apauley/hledger-flow/issues

extra-source-files:
  - README.md
  - ChangeLog.md
  - site/go-links.json

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Finance, Console

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README file.
description: Documentation and a quick start are at <https://hledger-flow.github.io/>

dependencies:
  - base >= 4.20 && < 4.22

library:
  source-dirs: src
  ghc-options:
    - -Wall
  dependencies:
    - bytestring >= 0.12.2.0 && < 0.13
    - http-client >= 0.7.19 && < 0.8
    - http-client-tls >= 0.3.6.4 && < 0.4
    - process >= 1.6.26.1 && < 1.7
    - async >= 2.2.6 && < 2.3
    - path >= 0.9.6 && < 0.10
    - path-io >= 1.8.2 && < 1.9
    - directory >= 1.3.8.5 && < 1.4
    - filepath >= 1.5.4.0 && < 1.6
    - exceptions >= 0.10.9 && < 0.11
    - text >= 2.1.3 && < 2.2
    - containers >= 0.7 && < 0.8
    - time (>= 1.12.2 && < 1.13) || (>= 1.14 && < 1.15)
    - stm >= 2.5.3.1 && < 2.6
    - gitrev >= 1.3.1 && < 1.4
    - aeson >= 2.2.5.1 && < 2.3
    - ansi-terminal >= 1.1.5 && < 1.2

executables:
  hledger-flow:
    main: Main.hs
    source-dirs: app
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
      - -Wall
      - -fPIC
    ld-options:
      - -dynamic # change to -static for a statically linked executable. Does not work on osx

    dependencies:
      - hledger-flow
      - path >= 0.9.6 && < 0.10
      - path-io >= 1.8.2 && < 1.9
      - text >= 2.1.3 && < 2.2
      - optparse-applicative >= 0.18.1.0 && < 0.20
    when:
      - condition: os(windows)
        dependencies:
          - code-page >= 0.2.1 && < 0.3

tests:
  hledger-flow-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - hledger-flow
      - path >= 0.9.6 && < 0.10
      - path-io >= 1.8.2 && < 1.9
      - aeson >= 2.2.5.1 && < 2.3
      - HUnit >= 1.6.2.0 && < 1.7
      - containers >= 0.7 && < 0.8
      - directory >= 1.3.8.5 && < 1.4
      - filepath >= 1.5.4.0 && < 1.6
      - text >= 2.1.3 && < 2.2
      - time (>= 1.12.2 && < 1.13) || (>= 1.14 && < 1.15)
      - stm >= 2.5.3.1 && < 2.6
