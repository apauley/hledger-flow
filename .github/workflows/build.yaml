name: Build & Release

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - v*.*.*
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:

  build:
    strategy:
      matrix:
        os:
          - ubuntu-latest     # x64
          - ubuntu-24.04-arm  # arm64
          - macos-15-intel    # Intel
          - macos-latest      # arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Set platform and Stack cache prefix
        id: global-variables
        env:
          # Bump this date to start fresh caches with the same resolver.
          CACHE_DATE: '20260105'
        run: |
          platform=$(printf '%s-%s' "$RUNNER_OS" "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')
          resolver=$(awk '/^resolver:/ { print $2; exit }' stack.yaml)
          : "${resolver:?Missing resolver in stack.yaml}"
          {
            echo "platform=$platform"
            echo "cache-prefix=$platform-stack-$resolver-$CACHE_DATE"
          } >> "$GITHUB_OUTPUT"

      - name: Cache - ghcup global
        id:  ghcup-global
        uses: actions/cache@v6
        with:
          path: ~/.ghcup
          key: ${{ steps.global-variables.outputs.cache-prefix }}-ghcup-global-${{ hashFiles('**.yaml') }}
          restore-keys: |
              ${{ steps.global-variables.outputs.cache-prefix }}-ghcup-global

      - name: Cache - stack global package db
        id:   stack-global
        uses: actions/cache@v6
        with:
          path: ~/.stack
          # XXX if stack.yaml is a symlink, this fails with
          #  Error: The template is not valid. .github/workflows/push.yml (Line: 103, Col: 14): hashFiles('**.yaml') failed.
          #  Fail to hash files under directory '/home/runner/work/hledger/hledger'
          key: ${{ steps.global-variables.outputs.cache-prefix }}-stack-global-${{ hashFiles('**.yaml') }}
          restore-keys: |
              ${{ steps.global-variables.outputs.cache-prefix }}-stack-global

      - name: Cache - stack-installed programs in ~/.local/bin
        id:   stack-programs
        uses: actions/cache@v6
        with:
          path: ~/.local/bin
          key: ${{ steps.global-variables.outputs.cache-prefix }}-stack-programs-${{ hashFiles('**.yaml') }}
          restore-keys: |
              ${{ steps.global-variables.outputs.cache-prefix }}-stack-programs

      - name: Cache - .stack-work
        uses: actions/cache@v6
        with:
          path: .stack-work
          key: ${{ steps.global-variables.outputs.cache-prefix }}-stack-work-${{ hashFiles('**.yaml') }}
          restore-keys: |
              ${{ steps.global-variables.outputs.cache-prefix }}-stack-work

      - name: Install eget
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp && curl https://zyedidia.github.io/eget.sh | sh && \
          mv ./eget /usr/local/bin/

      - name: Install hledger
        # hledger's releases are not available for linux-arm64
        if: ${{ steps.global-variables.outputs.platform != 'linux-arm64' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          eget hledgerorg/hledger --all --to /usr/local/bin/

      - name: Show hledger version
        # hledger's releases are not available for linux-arm64
        if: ${{ steps.global-variables.outputs.platform != 'linux-arm64' }}
        run: hledger --version

      - uses: haskell/ghcup-setup@v1

      - name: Setup ghcup
        run: |
          ghcup install stack

      - name: Stack Setup
        run: stack setup --interleaved-output

      - name: Test Hackage and Homebrew release steps offline
        if: matrix.os == 'ubuntu-latest'
        run: bash test/release/hackage.sh

      - name: Build and Test
        run: stack test --interleaved-output && stack install

      - name: Test CLI scenarios
        if: ${{ steps.global-variables.outputs.platform != 'linux-arm64' }}
        run: |
          stack build shelltestrunner
          stack exec -- shelltest --timeout=120 test/shell

      - name: Check hledger-flow info
        run: |
          ~/.local/bin/hledger-flow --help
          ~/.local/bin/hledger-flow --version
          # Check hledger-flow binary exists & its dynamically linked
          file ~/.local/bin/hledger-flow
          # List hledger-flow shared object dependencies - should be dynamic
          ldd ~/.local/bin/hledger-flow || true

      - name: Verify hledger-flow import & report scripts
        # hledger's releases are not available for linux-arm64
        if: ${{ steps.global-variables.outputs.platform != 'linux-arm64' }}
        run: |
          git clone --recurse-submodules https://github.com/apauley/hledger-flow-example.git "$HOME/hledger-flow-example" && \
          ~/.local/bin/hledger-flow --verbose --show-options import "$HOME/hledger-flow-example" && \
          ~/.local/bin/hledger-flow --verbose --show-options report "$HOME/hledger-flow-example"

      - name: Gather binaries
        run: |
          mkdir -p tmp
          cd tmp
          cp -P ~/.local/bin/hledger-flow .
          strip hledger-flow
          tar cvf hledger-flow-${{ steps.global-variables.outputs.platform }}.tar hledger-flow

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: hledger-flow-${{ steps.global-variables.outputs.platform }}
          path: |
            tmp/hledger-flow-${{ steps.global-variables.outputs.platform }}.tar
          if-no-files-found: error

  build_windows:
    name: Build (Windows x64)
    runs-on: windows-latest
    env:
      STACK_ROOT: C:\sr
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Install Stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-no-global: true

      - name: Cache Windows Stack toolchain and packages
        uses: actions/cache@v6
        with:
          path: |
            C:\sr
            ~\AppData\Local\Programs\stack
            .stack-work
          key: windows-x64-stack-${{ hashFiles('stack.yaml', 'stack.yaml.lock', 'package.yaml') }}
          restore-keys: |
            windows-x64-stack-

      - name: Install the latest upstream hledger release
        run: |
          $zip = Join-Path $env:RUNNER_TEMP hledger-windows-x64.zip
          $bin = Join-Path $env:RUNNER_TEMP hledger
          Invoke-WebRequest https://github.com/hledgerorg/hledger/releases/latest/download/hledger-windows-x64.zip -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $bin
          $bin >> $env:GITHUB_PATH

      - name: Build and test hledger-flow from this checkout
        run: |
          stack test --interleaved-output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          stack install shelltestrunner --local-bin-path dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = ((Select-String '^version: (\S+)$' package.yaml).Matches.Groups[1]).Value
          "HLEDGER_FLOW_VERSION=$version" >> $env:GITHUB_ENV
          $parts = @($version.Split('.'))
          while ($parts.Count -lt 4) { $parts += '0' }
          $ghc = stack path --compiler-exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $windres = Join-Path (Split-Path (Split-Path $ghc)) 'mingw/bin/windres.exe'
          & $windres "-DNUMERIC_VERSION=$($parts -join ',')" "-DVERSION_STRING=`"$version`"" -i bin/windows-version.rc -o dist/version.o -O coff
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Relink even if the Stack cache contains a build without this resource.
          stack install hledger-flow --force-dirty --ghc-options="-fforce-recomp -optldist/version.o" --local-bin-path dist

      - name: Test native Windows CLI scenarios with Git Bash
        shell: bash
        run: |
          export PATH="$PWD/dist:$PATH"
          hledger --version
          ./dist/hledger-flow.exe --version
          shelltest --timeout=120 --shell=sh --exclude=posix-preprocess.test test/shell test/windows

      - name: Package Windows binary
        run: |
          Compress-Archive -LiteralPath dist/hledger-flow.exe,QUICKSTART.md -DestinationPath dist/hledger-flow-windows-x64.zip

      - name: Smoke-test packaged Windows binary
        run: |
          Expand-Archive -LiteralPath dist/hledger-flow-windows-x64.zip -DestinationPath tmp/windows-release
          if (!(Test-Path -LiteralPath tmp/windows-release/QUICKSTART.md)) { throw 'Quick-start missing from release ZIP' }
          $info = (Get-Item tmp/windows-release/hledger-flow.exe).VersionInfo
          $expected = $env:HLEDGER_FLOW_VERSION
          if ($info.ProductName -ne 'hledger-flow' -or $info.ProductVersion -ne $expected -or $info.FileVersion -ne $expected) {
            throw "Incorrect version metadata: $info"
          }
          # Check that the release runs without Stack or GHC on PATH.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          ./tmp/windows-release/hledger-flow.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tmp/windows-release/hledger-flow.exe --version

      - name: Upload Windows binary
        uses: actions/upload-artifact@v7
        with:
          name: hledger-flow-windows-x64
          path: dist/hledger-flow-windows-x64.zip
          if-no-files-found: error

  sign_macos:
    name: Sign (${{ matrix.platform }})
    if: (github.event_name == 'push' && github.ref_type == 'tag') || github.event_name == 'workflow_dispatch'
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: macos-x64
          - os: macos-latest
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Download unsigned macOS binary
        uses: actions/download-artifact@v8
        with:
          name: hledger-flow-${{ matrix.platform }}
          path: unsigned

      - name: Import macOS signing certificate
        uses: Apple-Actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          keychain: hledger-flow-signing
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Sign macOS binary
        env:
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          keychain_path="hledger-flow-signing.keychain"
          security find-identity -v -p codesigning "$keychain_path"

          mkdir -p signed
          tar -xf "unsigned/hledger-flow-${PLATFORM}.tar" -C signed
          test -x signed/hledger-flow
          # The build already stripped the binary; never strip it after signing.
          codesign --force --options runtime --timestamp \
            --identifier org.hledger-flow.cli \
            --keychain "$keychain_path" \
            --sign 'Developer ID Application: FernTrail B.V. (4UJZ75B7VG)' \
            signed/hledger-flow
          codesign --verify --strict --verbose=4 \
            --test-requirement '=anchor apple generic and certificate leaf[subject.OU] = "4UJZ75B7VG"' \
            signed/hledger-flow

      - name: Smoke-test signed binary
        run: |
          signed/hledger-flow --help
          signed/hledger-flow --version

      - name: Package signed binary
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p dist
          tar -C signed -cf "dist/hledger-flow-${PLATFORM}.tar" hledger-flow

      - name: Upload signed macOS binary
        uses: actions/upload-artifact@v7
        with:
          name: signed-hledger-flow-${{ matrix.platform }}
          path: dist/hledger-flow-${{ matrix.platform }}.tar
          if-no-files-found: error
          retention-days: 30

  # Notarization and release use the same signed bytes independently. A failed
  # notarization stays visible and can be rerun without rebuilding or releasing.
  notarize_macos:
    name: Notarize (${{ matrix.platform }})
    needs: sign_macos
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-x64, macos-arm64]
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Download signed macOS binary
        uses: actions/download-artifact@v8
        with:
          name: signed-hledger-flow-${{ matrix.platform }}
          path: signed

      - name: Notarize macOS binary
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          tar -xf "signed/hledger-flow-${PLATFORM}.tar" -C signed
          test -x signed/hledger-flow
          verify_ticket() {
            codesign --verify --strict --verbose=4 \
              --test-requirement '=notarized' --check-notarization signed/hledger-flow
          }
          if verify_ticket; then
            echo "Apple notarization ticket is already available"
            exit 0
          fi

          : "${APPLE_API_KEY_BASE64:?Missing notarization key}"
          : "${APPLE_API_KEY_ID:?Missing API key ID}"
          : "${APPLE_API_ISSUER_ID:?Missing API issuer ID}"

          api_key_path="$RUNNER_TEMP/hledger-flow-notary.p8"
          trap 'rm -f "$api_key_path"' EXIT
          umask 077
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$api_key_path"
          auth=(--key "$api_key_path" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")
          submission="$RUNNER_TEMP/hledger-flow-notary.zip"
          result="$RUNNER_TEMP/notarization.json"
          ditto -c -k --keepParent signed/hledger-flow "$submission"
          xcrun notarytool submit "$submission" "${auth[@]}" \
            --output-format json > "$result"
          cat "$result"
          submission_id="$(plutil -extract id raw -o - "$result")"

          notarization_exit=0
          xcrun notarytool wait "$submission_id" "${auth[@]}" \
            --timeout 30m --output-format json > "$result" || notarization_exit=$?
          cat "$result"
          if ! xcrun notarytool log "$submission_id" "${auth[@]}"; then
            echo "::warning::Unable to fetch notarization log for $submission_id"
          fi
          if (( notarization_exit != 0 )); then
            exit "$notarization_exit"
          fi
          test "$(plutil -extract status raw -o - "$result")" = Accepted
          # Apple may accept the submission before the ticket reaches this runner.
          for attempt in {1..11}; do
            if verify_ticket; then exit 0; fi
            if (( attempt < 11 )); then sleep 30; fi
          done
          echo "::error::Apple accepted submission $submission_id but its ticket is still unavailable after five minutes. Check the existing ticket before resubmitting."
          exit 1

      - name: Clean up notarization key
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/hledger-flow-notary.p8"

      - name: Report notarization failure
        if: failure()
        run: |
          echo "::warning::Notarization failed. The signed release is unaffected; inspect the Apple log and rerun this job."

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, build_windows, sign_macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # sign build provenance attestations
      attestations: write  # store them for `gh attestation verify`

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check tag, package.yaml and ChangeLog.md agree
        run: |
          test "${GITHUB_REF_NAME}" = "v$(awk '/^version:/ {print $2}' package.yaml)"
          bin/release changelog
          bin/release notes > release-notes.md

      - name: Download Linux binaries
        uses: actions/download-artifact@v8
        with:
          pattern: hledger-flow-linux-*
          merge-multiple: true
          path: artifacts

      - name: Download signed macOS binaries
        uses: actions/download-artifact@v8
        with:
          pattern: signed-hledger-flow-macos-*
          merge-multiple: true
          path: artifacts

      - name: Download Windows binary
        uses: actions/download-artifact@v8
        with:
          name: hledger-flow-windows-x64
          path: artifacts

      # Tar preserves executable permissions across artifact upload/download.
      - name: Repack unix artifacts with gz
        shell: bash
        run: |
          cd artifacts
          for platform in linux-x64 linux-arm64 macos-x64 macos-arm64; do
            archive="hledger-flow-${platform}.tar"
            test "$(tar -tf "$archive")" = hledger-flow
            tar -rf "$archive" -C .. QUICKSTART.md
            gzip "$archive"
          done

      # Attest the exact files uploaded below, so users can check a download was
      # built by this workflow from the tagged commit.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/hledger-flow-windows-x64.zip

      - name: Create GitHub Release with artifacts
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/hledger-flow-windows-x64.zip
          fail_on_unmatched_files: true
          body_path: release-notes.md
          draft: true
